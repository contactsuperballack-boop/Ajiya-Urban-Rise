name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency vulnerability scan
        # Non-zero exit on high/critical advisories fails the job. Moderate/low findings are
        # visible in the log but don't block — tune --audit-level if that's too strict/loose
        # for this team's risk tolerance.
        run: pnpm audit --audit-level=high

  e2e:
    name: Critical E2E journeys
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          # E2E tests assume seeded CMS content (see cms/SETUP.md) — point this at a real
          # staging CMS/API once one exists in CI. Left as a placeholder so the workflow is
          # complete and runnable once that's wired up, rather than silently skipped.
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
